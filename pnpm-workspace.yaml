packages:
  - 'examples/*/*'

catalog:
  '@eslint/js': 10.0.1
  '@marcalexiei/oxfmt-config': 2.0.1
  '@types/node': 26.6.5
  eslint: 10.13.0
  eslint-plugin-zod: 5.2.2
  eslint-plugin-zod-mini: 2.1.3
  oxfmt: 0.74.0
  oxlint: 1.89.0
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  zod: 4.6.7

minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  - '@eslint-zod/utils'
  - '@marcalexiei/oxfmt-config'
  - eslint-plugin-zod
  - eslint-plugin-zod-mini

trustPolicy: no-downgrade

# Fail a script run if node_modules is out of sync with the lockfile.
verifyDepsBeforeRun: error

# Keep eslint unreachable from the oxlint packages.
autoInstallPeers: false
hoist: false
dedupePeerDependents: false
