packages:
  - 'examples/*'

catalog:
  '@eslint/js': 10.0.1
  '@marcalexiei/oxfmt-config': 2.0.0
  '@types/node': 26.6.3
  eslint: 10.11.0
  eslint-plugin-zod: 5.0.0
  eslint-plugin-zod-mini: 2.0.0
  oxfmt: 0.71.0
  oxlint: 1.86.0
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  zod: 4.6.5

minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  - '@eslint-zod/utils'
  - eslint-plugin-zod
  - eslint-plugin-zod-mini

trustPolicy: no-downgrade

# Fail a script run if node_modules is out of sync with the lockfile.
verifyDepsBeforeRun: error
